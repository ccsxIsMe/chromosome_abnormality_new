method: haar_like_adaboost_pair_baseline
task: supervised_pair_abnormality
train_csv: data_protocol/p1_pair_case_isolated_v1/train.csv
val_csv: data_protocol/p1_pair_case_isolated_v1/val.csv
test_csv: data_protocol/p1_pair_case_isolated_v1/test.csv
split_summary:
  train_csv: data_protocol/p1_pair_case_isolated_v1/train.csv
  val_csv: data_protocol/p1_pair_case_isolated_v1/val.csv
  test_csv: data_protocol/p1_pair_case_isolated_v1/test.csv
  train_has_case_id: true
  train_num_cases: 20
  val_has_case_id: true
  val_num_cases: 6
  test_has_case_id: true
  test_num_cases: 6
  case_isolation_checkable: true
  train_val_overlap_cases: []
  train_test_overlap_cases: []
  val_test_overlap_cases: []
  num_train_val_overlap: 0
  num_train_test_overlap: 0
  num_val_test_overlap: 0
  is_case_isolated: true
feature_settings:
  profile_length: 128
  band_width: 32
  kernel_sizes:
  - 4
  - 8
  - 16
  - 32
  - 64
  representation_version: v2
  pair_orientation_align: true
  feature_set: 1d
  feature_select_mode: all
  feature_topk: 128
  num_feature_columns: 757
  haar_kernel_catalog:
    feature_set: 1d
    kernel_sizes:
    - 4
    - 8
    - 16
    - 32
    - 64
    one_d_templates:
    - name: step
      weights:
      - 1.0
      - -1.0
    - name: reverse_step
      weights:
      - -1.0
      - 1.0
    - name: peak
      weights:
      - 1.0
      - -2.0
      - 1.0
    - name: valley
      weights:
      - -1.0
      - 2.0
      - -1.0
    - name: edge_triplet
      weights:
      - 1.0
      - 0.0
      - -1.0
model_settings:
  classifier: AdaBoostClassifier
  n_estimators: 200
  learning_rate: 0.5
  weak_learner: DecisionTreeClassifier
  weak_learner_max_depth: 1
  seed: 42
