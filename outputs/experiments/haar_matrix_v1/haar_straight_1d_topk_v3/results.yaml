method: haar_like_adaboost_pair_baseline
task: supervised_pair_abnormality
train_csv: data_protocol/p1_pair_case_isolated_straight_out_v1/train.csv
val_csv: data_protocol/p1_pair_case_isolated_straight_out_v1/val.csv
test_csv: data_protocol/p1_pair_case_isolated_straight_out_v1/test.csv
split_summary:
  train_csv: data_protocol/p1_pair_case_isolated_straight_out_v1/train.csv
  val_csv: data_protocol/p1_pair_case_isolated_straight_out_v1/val.csv
  test_csv: data_protocol/p1_pair_case_isolated_straight_out_v1/test.csv
